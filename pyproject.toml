[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bitmesh-python-sdk"
version = "0.1.0"
description = "Python SDK for the Bitmesh AI API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Shabab Haider Siddique", email = "shabab.h.siddique@gmail.com" }]
keywords = ["bitmesh", "bitmesh-ai", "ai", "api", "sdk", "chat", "llm"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = [
  "requests>=2.28",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "python-dotenv>=1.0", "responses>=0.25"]
examples = ["python-dotenv>=1.0"]

[project.urls]
Source = "https://github.com/bitmeshai/bitmesh-python-sdk"

[tool.hatch.build.targets.sdist]
include = ["/src", "/README.md", "/LICENSE"]

[tool.hatch.build.targets.wheel]
packages = ["src/bitmesh_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not expensive'"
markers = [
  "expensive: Integration tests that are slow or higher cost (e.g. video generation)",
]

[tool.ruff]
line-length = 100
target-version = "py310"
